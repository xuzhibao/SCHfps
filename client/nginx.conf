map $http_x_forwarded_proto $pixelstrike_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_real_ip $pixelstrike_real_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location = /admin {
        try_files /admin.html =404;
        add_header Cache-Control "no-store";
    }

    location = /admin.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /map.json {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket proxy to backend container
    location /ws {
        proxy_pass http://server:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $pixelstrike_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pixelstrike_proto;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API endpoints proxy
    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $pixelstrike_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pixelstrike_proto;
    }

    # Static assets long-term caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    location /sfx/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
