services:
  server:
    image: pixel-strike-server:latest
    container_name: pixelstrike-prod-server
    restart: unless-stopped
    mem_limit: 512m
    environment:
      PORT: 8080
      DB_PATH: /data/stats.db
      MAP_PATH: /app/map.json
      ADMIN_PASSWORD: ${PIXEL_STRIKE_ADMIN_PASSWORD:-}
      ADMIN_COOKIE_SECURE: ${PIXEL_STRIKE_ADMIN_COOKIE_SECURE:-true}
      TRUSTED_PROXY_CIDRS: ${PIXEL_STRIKE_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    volumes:
      - ./data:/data

  client:
    image: pixel-strike-client:latest
    container_name: pixelstrike-prod-client
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:${PIXEL_STRIKE_PORT:-12888}:80"
    depends_on:
      - server
